name: hermes-soroush-messenger
label: Soroush Plus
kind: platform
version: 1.1.0
description: |
  Soroush Plus (سروش پلاس) platform adapter for Hermes Agent.
  Direct official Bot API (https://api.splus.ir/bot<TOKEN>/...) —
  Telegram-compatible REST, no third-party SDK. Requires a Soroush
  bot token from splus.ir/botfather.
author: علی محمودی (mah92)
requires_env:
  - name: SOROUSH_BOT_TOKEN
    description: "Soroush Plus bot token (e.g. 12345:ABC...). Get it from Soroush's official bot/developer channel."
    prompt: "Soroush bot token"
    password: true
optional_env:
  - name: SOROUSH_HOME_CHANNEL
    description: "Default chat ID for cron/notification delivery"
    prompt: "Home chat ID (or empty)"
    password: false
  - name: SOROUSH_ALLOWED_CHATS
    description: "Comma-separated chat IDs allowed to interact (empty = all)"
    prompt: "Allowed chat IDs (comma-separated, or empty for all)"
    password: false
  - name: SOROUSH_ALLOWED_USERS
    description: "Comma-separated user IDs allowed to interact (empty = all)"
    prompt: "Allowed user IDs (comma-separated)"
    password: false
  - name: SOROUSH_ALLOW_ALL_USERS
    description: "Set to 'true' to allow all users regardless of list"
    prompt: "Allow all users? (true/false)"
    password: false
